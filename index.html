r zr=[{id:1,title:"الدرس 1 - تطور تكنولوجيا المعلومات والتحول الاجتماعي",badge:"الدرس الأول",models:[{label:"A",essays:[{id:"t1-A-e1",q:"اشرح المراحل التاريخية لتطور تكنولوجيا المعلومات منذ ظهور الحواسيب الإلكترونية في الأربعينيات وحتى الستينيات مبيناً الغرض الأساسي لاستخدامها في تلك الفترة.",model:"ظهرت الحواسيب الإلكترونية الأولى في أربعينيات القرن العشرين، وكان استخدامها الأساسي محصوراً في الأغراض العسكرية والحسابات العلمية لدى المؤسسات والجهات الحكومية والبحثية الكبرى."},{id:"t1-A-e2",q:"اشرح «قانون مور» موضحاً ما يصفه، والتحديات الهندسية والفيزيائية التي تواجه استمرار تصغير مكونات الدوائر.",model:'يصف قانون مور ملاحظة تجريبية تنص على أن "عدد الترانزستورات في الدائرة المتكاملة يتضاعف تقريباً كل عامين". وتواجه استمرار تصغير المكونات تحديات هندسية وفيزيائية مثل تيارات التسرب والتأثيرات الكمومية والنفق الكمومي التي تُبطئ هذا الاتجاه.'},{id:"t1-A-e3",q:"عدّد التحولات المجتمعية الخمسة الناتجة عن تكنولوجيا المعلومات، موضحاً مفهوم كل من «العمل عن بعد» و«التجارة الإلكترونية».",model:"التحولات الخمسة: شبكات التواصل الاجتماعي (SNS)، التجارة الإلكترونية، العمل عن بُعد، التعلم عبر الإنترنت، والدفع غير النقدي. العمل عن بعد: أداء الشخص لمهامه ووظائفه من المنزل أو موقع بعيد عبر الإنترنت. التجارة الإلكترونية: عمليات بيع السلع والخدمات وشراؤها عبر الإنترنت."},{id:"t1-A-e4",q:"وضح خصائص واستخدامات التقنيات الناشئة الثلاث البارزة (القيادة الذاتية، الواقع المعزز/الافتراضي، والحوسبة الكمومية).",model:"القيادة الذاتية: تقنية تعتمد على الذكاء الاصطناعي والمستشعرات للتحكم بالمركبات مع معالجة البيانات محلياً بالحوسبة الطرفية. الواقع المعزز يضيف عناصر رقمية فوق المشهد الحقيقي، بينما الافتراضي يغمر المستخدم في بيئة حاسوبية افتراضية بالكامل. الحوسبة الكمومية: يعتمد نهجها على الكيوبتات والتراكب الكمومي لمعالجة هائلة وتفوق حاسوبي في مسائل محددة."}],mcqs:[{id:"t1-A-m1",q:"في أي فترة زمنية بدأت تتيح الإنترنت للاستخدام التجاري وظهر الويب مما توسع معه الوصول العالمي إلى المعلومات؟",options:["الأربعينيات والستينيات","التسعينيات","السبعينيات والثمانينيات","من العقد الثاني من الألفية فصاعداً"],correct:1,explain:"التسعينيات هي فترة الإتاحة التجارية للإنترنت وانتشار الويب."},{id:"t1-A-m2",q:"ما هي التقنية التي تستخدم الذكاء الاصطناعي للمساعدة على قيادة المركبة باستخدام الكاميرات والمستشعرات؟",options:["الواقع المعزز","القيادة الذاتية","الحوسبة الكمومية","الدفع غير النقدي"],correct:1,explain:"القيادة الذاتية تعتمد على AI والكاميرات والمستشعرات."}]},{label:"B",essays:[{id:"t1-B-e1",q:"اشرح كيف أثر ظهور الحواسيب الشخصية (PCs) وانتشار الوصول العالمي إلى المعلومات والبريد الإلكتروني على المجتمع في فترة السبعينيات والثمانينيات.",model:"أدى انتشار الحواسيب الشخصية إلى تحول الاستخدام من المؤسسات الكبرى إلى الأفراد، وبدأ انتشار التطبيقات المكتبية والاتصالات عبر البريد الإلكتروني، مما أتاح وصولاً أوسع وأسرع للمعلومات وتطوير بيئة العمل."},{id:"t1-B-e2",q:"اشرح كيف يؤدي استمرار تصغير مكونات الدوائر في قانون مور إلى ظهور تحديات هندسية وفيزيائية مثل تيارات التسرب والتأثيرات الكمومية والنفق الكمومي.",model:"عند تصغير الترانزستورات إلى أحجام ميكرومترية ونانومترية فائقة، تكتسب الذرات سلوكيات كمومية تسبب تسرب الإلكترونات والحرارة العالية، مما يصعب التحكم بالتيار ويحد من زيادة السرعة بنفس المعدل التاريخي."},{id:"t1-B-e3",q:"وضح باختصار مفهوم كل من «شبكات التواصل الاجتماعي (SNS)» و«التعلم عبر الإنترنت» و«الدفع غير النقدي» باعتبارها تحولات مجتمعية.",model:"شبكات التواصل الاجتماعي: منصات تتيح للمستخدمين التواصل ونشر المحتوى ومشاركته فورياً. التعلم عبر الإنترنت: تقديم الدروس والمناهج والمواد التعليمية عبر شبكة الإنترنت. الدفع غير النقدي: تسديد قيمة المشتريات والخدمات إلكترونياً أو بالبطاقات ورموز QR دون النقد الورقي."}],mcqs:[{id:"t1-B-m1",q:"الفترة الزمنية التي شهدت ظهور الهواتف الذكية وانتشار الإنترنت عبر الهواتف المحمولة بسرعة هي:",options:["السبعينيات والثمانينيات","العقد الأول من الألفية","التسعينيات","الأربعينيات"],correct:1,explain:"العقد الأول من الألفية هو فترة انتشار الهواتف الذكية."},{id:"t1-B-m2",q:"تقنية تضيف عناصر أو معلومات رقمية إلى مشهد من العالم الحقيقي تُعرف باسم:",options:["الواقع الافتراضي (VR)","القيادة الذاتية","الواقع المعزز (AR)","الحوسبة الكمومية"],correct:2,explain:"الواقع المعزز AR هو إضافة عناصر رقمية فوق الواقع."},{id:"t1-B-m3",q:"أي الملاحظات الآتية تصف بدقة ما يفعله «قانون مور»؟",options:["تضاعف عدد الترانزستورات في الدائرة المتكاملة تقريباً كل عامين","ثبات عدد الترانزستورات وعدم تغيرها عبر الزمن","زيادة استهلاك الطاقة في الحواسيب التقليدية بمقدار الضعف سنوياً","انخفاض قدرات الحوسبة مع مرور السنوات"],correct:0,explain:"قانون مور: تضاعف عدد الترانزستورات تقريباً كل عامين."}]},{label:"C",essays:[{id:"t1-C-e1",q:"ناقش أثر ظهور الويب وانتشار الإنترنت في تسعينيات القرن العشرين على إتاحة المعلومات للاستخدام التجاري والعالمي.",model:"فتح ظهور الويب آفاقاً جديدة بتحويل الإنترنت إلى بيئة تجارية مفتوحة، مما سمح بظهور المتاجر الإلكترونية، والموقع والمنتديات الإخبارية، وجعل الحصول على المعلومات عالمياً ومتاحاً للعامة."},{id:"t1-C-e2",q:"وضح كيف تعد القيادة الذاتية من ضمن التقنيات الناشئة البارزة.",model:"تعد تقنية ناشئة بارزة لأنها تجمع بين الذكاء الاصطناعي لإدراك المحيط، والكاميرات والمستشعرات لاتخاذ القرارات، معتمدةً على الحوسبة الطرفية لتقليل زمن الاستجابة وضمان السلامة."}],mcqs:[{id:"t1-C-m1",q:"أسلوب عمل يؤدي فيه الشخص مهامه ووظائفه من المنزل أو موقع آخر بعيد باستخدام الاتصال بالإنترنت يُسمى:",options:["التعلم عبر الإنترنت","العمل عن بعد (Remote Work)","القيادة الذاتية","الحوسبة الطرفية"],correct:1,explain:"العمل عن بعد هو أداء المهام من المنزل عبر الإنترنت."}]}]},{id:2,title:"الدرس 2 - كيف يعمل الذكاء الاصطناعي (مدمج مع الأخلاقيات)",badge:"الدرس الثاني",models:[{label:"A",essays:[{id:"t2-A-e1",q:"اشرح ماهية «التحيز الخوارزمي» في أنظمة الذكاء الاصطناعي مبيناً كيف ينشأ من بيانات التدريب أو تصميم النظام وطريقة استخدامها مع ذكر أمثلة.",model:"التحيز الخوارزمي هو نمط خروج نتائج غير عادلة أو تمييزية في أحكام النظام. وينشأ بسبب وجود تحيز أو عدم كفاية في بيانات التدريب التي يُلقم بها النظام، أو انعكاس نزعات تمييزية بشرية سابقة في البيانات، أو بسبب سوء اختيار المتغيرات أثناء تصميم النظام. مثال: نظام توظيف يفضل فئة عرقية أو جنسية معينة."},{id:"t2-A-e2",q:"تكلم بالتفصيل عن «الذكاء الاصطناعي القابل للتفسير (XAI)» ومشكلة «الصندوق الأسود» وكيف يساهم في تقييم النظام واكتشاف الأخطاء؟",model:"الصندوق الأسود يصف حالة الغموض وعدم معرفة كيفية اتخاذ الذكاء الاصطناعي لقراره. ويسهم الذكاء الاصطناعي القابل للتفسير (XAI) في تقديم آليات تتيح للبشر توضيح وشرح العوامل والمنطق الخوارزمي المتبع، مما يساعد المطورين والخبراء على مراجعة القرار واكتشاف الأخطاء وتعديلها."},{id:"t2-A-e3",q:"قارن بدقة بين مفهوم «المسؤولية» ومفهوم «المساءلة» موضحاً سبب اختلاف توزيع المسؤولية باختلاف السياقات والأطراف (المطور، المشغل، المستخدم)؟",model:"المسؤولية تحدد الأدوار والواجبات المناطة بكل طرف في إنشاء وتشغيل النظام، بينما المساءلة تعني تحديد الجهة المسؤولة قانونياً وأخلاقياً عن الآثار والأخطاء ومحاسبتها. ويختلف التوزيع حيث يتكفل المطور بجودة الخوارزميات، والمشغل بسلامة النشر، والمستخدم بطريقة الاستعمال المسؤول."},{id:"t2-A-e4",q:"اذكر المبادئ الأربعة الأساسية لأخلاقيات الذكاء الاصطناعي واشرح باختصار المقصود بكل من «العدالة»، «الشفافية»، «حماية الخصوصية»، و«المساءلة».",model:"العدالة: ضمان عدم التمييز وظلم أي فئة عند تطبيق النظام. الشفافية: توفير معلومات واضحة عن طريقة اتخاذ القرار وحدود النظام. حماية الخصوصية: حماية البيانات والمعلومات الشخصية من الانتهاك أو سوء الاستغلال. المساءلة: تحديد الجهات المسؤولة عن نتائج النظام وإمكانية محاسبتها."}],mcqs:[{id:"t2-A-m1",q:"نمط في مخرجات الذكاء الاصطناعي قد يؤدي إلى نتائج غير عادلة أو ضارة، وينشأ من البيانات أو التصميم يُسمى:",options:["الذكاء الاصطناعي القابل للتفسير","التحيز الخوارزمي","الشفافية المطلقة","حماية الخصوصية"],correct:1,explain:"التحيز الخوارزمي هو النمط المؤدي لنتائج غير عادلة."},{id:"t2-A-m2",q:"تقنية تتيح للبشر فهم سبب اتخاذ الذكاء الاصطناعي حكماً معيناً وتساعد على تجنب مشكلة الصندوق الأسود هي:",options:["الذكاء الاصطناعي القابل للتفسير (XAI)","الحوسبة الطرفية","بيانات التدريب","التحيز الخوارزمي"],correct:0,explain:"XAI هو حل مشكلة الصندوق الأسود."},{id:"t2-A-m3",q:"المبدأ الذي يعني التعامل مع المعلومات الشخصية بشكل مناسب وحمايتها هو:",options:["العدالة","الشفافية","حماية الخصوصية","المساءلة"],correct:2,explain:"حماية الخصوصية هي المبدأ المقصود."},{id:"t2-A-m4",q:"تحديد الجهات المسؤولة عن النظام وقراراته وآثاره وإمكان محاسبتها وفق أدوارها يمثل مبدأ:",options:["الشفافية","العدالة","المساءلة","حماية الخصوصية"],correct:2,explain:"المساءلة تعني تحديد المسؤوليات والمحاسبة."}]},{label:"B",essays:[{id:"t2-B-e1",q:"وضح كيف يمكن أن تؤدي بيانات التدريب غير الممثلة أو المتحيزة (مثل انعكاس نزعات تمييزية سابقة) إلى تكرار الذكاء الاصطناعي لهذا التحيز في أحكامه.",model:"نظراً لأن خوارزميات التعلم الآلي تنشئ قواعدها بناءً على الأنماط الموجودة في بيانات التدريب، فعند تزويد النظام ببيانات غير متوازنة أو تحتوي على تحيزات سابقة، فإن الخوارزمية تعتبر هذه التحيزات قاعدة صحيحة وتكرر إنتاج أحكام متحيزة ضد نفس الفئات."},{id:"t2-B-e2",q:"اشرح مشكلة «الصندوق الأسود» في خوارزميات الذكاء الاصطناعي المعقدة ولماذا يجعل تقييم الآلية واكتشاف الأخطاء أمراً صعباً دون استخدام تقنيات التفسير.",model:"تنشأ المشكلة بسبب التعقيد العالي وتعدد الطبقات في الشبكات العصبية مما يجعل عملية الانتقال من المدخلات إلى القرار غير مرئية للعين البشرية؛ وهذا يخفي سبب أخطاء القرار ويصعّب تقييم النظام مالم تُطبق تقنيات التفسير (XAI) للكشف عن المنطق الخوارزمي الداخلي."},{id:"t2-B-e3",q:"اذكر قضايا الخصوصية المرتبطة بانتشار تقنيات التعرف على الوجه في الأماكن العامة والجمع الجماعي للبيانات والسلوك عبر الإنترنت.",model:"تؤدي إلى إمكانية تتبع حركة الأفراد بدون موافقتهم الصريحة، وتجميع السجلات الشخصية واستغلال البيانات في أغراض التنميط أو الانتهاك الدائم لخصوصية حياتهم الرقمية والواقعية."},{id:"t2-B-e4",q:"اشرح بالتفصيل المبادئ الأربعة الأساسية لأخلاقيات الذكاء الاصطناعي وكيف يوجه كل منها الاستخدام المسؤول لهذه التقنيات في المجتمع.",model:"يوجه العدالة النظام لعدم التمييز بين الأفراد، ويمنح مبدأ الشفافية المستخدم حق فهم الحدود وكيفية اتخاذ القرار، ويحمي مبدأ حماية الخصوصية البيانات الشخصية، بينما يُحدد مبدأ المساءلة الجهات والمؤسسات المسؤولة التي يمكن محاسبتها عن أي خلل."}],mcqs:[{id:"t2-B-m1",q:"الأمثلة التي يتعلم منها نظام الذكاء الاصطناعي أنماطه قبل استخدامه وتؤثر بشكل مباشر على جودة مخرجاته تسمى:",options:["بيانات التدريب","خوارزميات التشفير","الأجهزة الطرفية","الذاكرة العشوائية"],correct:0,explain:"بيانات التدريب هي التي يتعلم منها النظام وتؤثر مباشرة على جودة مخرجاته."},{id:"t2-B-m2",q:"إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وعملية اتخاذ القرار وحدوده يعد تعريفاً دقيقاً لمبدأ:",options:["العدالة","الشفافية","المساءلة","حماية الخصوصية"],correct:1,explain:"الشفافية هي إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وحدوده."},{id:"t2-B-m3",q:"عدم التمييز ظلماً ضد أي شخص أو مجموعة بعينها في أحكام ومخرجات الذكاء الاصطناعي يمثل مبدأ:",options:["العدالة","الشفافية","حماية الخصوصية","المساءلة"],correct:0,explain:"العدالة هي عدم التمييز ظلماً ضد أي شخص أو مجموعة بعينها."},{id:"t2-B-m4",q:"الأسلوب أو التقنية التي تساعد البشر على فهم العوامل التي أسهمت في وصول النظام إلى مخرج أو قرار معين هي:",options:["التحيز الخوارزمي","الذكاء الاصطناعي القابل للتفسير (XAI)","الحوسبة الطرفية","بيانات التدريب"],correct:1,explain:"XAI هو الأسلوب الذي يساعد على فهم العوامل التي أسهمت في وصول النظام إلى قرار معين."}]},{label:"C",essays:[{id:"t2-C-e1",q:"ناقش أسباب التحيز الخوارزمي وكيف يمكن أن ينشأ من الاختيار غير المناسب للمتغيرات، أو استخدام متغير بديل يمثل بشكل غير مباشر سمة محمية؟",model:"ينشأ التحيز عند اختيار متغيرات غير متوازنة، أو عند حذف سمة حساسة (مثل الجنس أو النژاد) مع استبدالها بمتغير بديل (مثل الرمز البريدي أو المسمى الوظيفي) يرتبط بها وثيقاً، فيستمر النظام في إجراء التمييز الضمني غير المباشر بسببه."},{id:"t2-C-e2",q:"بين أهمية «الذكاء الاصطناعي القابل للتفسير (XAI)» في معالجة صعوبة تقييم آلية الوصول إلى النتيجة عندما تكون غير واضحة للعين البشرية؟",model:"تكمن أهميته في تقديم أدوات تفكك التعقيد الداخلي للنماذج العميقة وتوضح الوزن النسبي للمتغيرات، مما يحول النظام من صندوق أسود غامض إلى نموذج شفاف يمكن التحقق من صحة منطق أحكامه واكتشاف أسباب الخلل."},{id:"t2-C-e3",q:"وضح الأبعاد المختلفة لمسؤولية الأطراف المتعددة (المطور، الشركة المشغلة، المستخدم) عند اتخاذ نظام الذكاء الاصطناعي حكماً خاطئاً أو غير عادل.",model:"يتحمل المطور مسؤولية جودة بناء النموذج واختبار التحيز والبيانات، بينما تتحمل الشركة المشغلة مسؤولية قرار النشر والسياق المطبق فيه النظام، ويتحمل المستخدم مسؤولية متابعة المخرجات وإعمال التفكير الناقد وعدم الاعتماد الأعمى عليها."},{id:"t2-C-e4",q:"اشرح كيف تتكامل المبادئ الأربعة لأخلاقيات الذكاء الاصطناعي (العدالة، الشفافية، حماية الخصوصية، المساءلة) لتشكيل إطار متكامل للاستخدام المسؤول.",model:"تتكامل المبادئ بحيث تضمن العدالة مخرجات متكافئة، وتتيح الشفافية وفهم آلية القرار تحقق أفراد المجتمع منه، بينما تحمي الخصوصية البيانات الحساسة، ويضمن مبدأ المساءلة وجود أطراف محددة يُرجع إليها لمحاسبتها وتعديل الأخطاء عند وقوعها."}],mcqs:[{id:"t2-C-m1",q:"تحديد أدوار وواجبات الأطراف المرتبطة بتطوير النظام وتشغيله واستخدامه (المطور، المشغل، المستخدم) يشير إلى مصطلح:",options:["المسؤولية","التحيز الخوارزمي","بيانات التدريب","الشفافية"],correct:0,explain:"المسؤولية هي تحديد أدوار وواجبات الأطراف المرتبطة بتطوير النظام وتشغيله واستخدامه."},{id:"t2-C-m2",q:"نظام أو تقنية تجمع كميات كبيرة من بيانات السلوك عبر الإنترنت وتسمح بتتبع الأفراد في الأماكن العامة تثير قضايا تتعلق بـ:",options:["سرعة المعالجة الحاسوبية","حماية الخصوصية","كفاءة الذاكرة المركزية","قانون مور"],correct:1,explain:"تثير قضايا تتعلق بحماية الخصوصية بسبب تتبع الأفراد وجمع بيانات سلوكهم."},{id:"t2-C-m3",q:"إحدى الآتي تمثل الوصف الدقيق لمبدأ «المساءلة»:",options:["إتاحة معلومات واضحة عن النظام وحدوده","عدم التمييز ظلماً ضد أي شخص أو مجموعة","تحديد الجهات المسؤولة عن النظام وقراراته وإمكان محاسبتها وفق أدوارها","فهم العوامل التي أسهمت في وصول النظام إلى مخرج معين"],correct:2,explain:"المساءلة هي تحديد الجهات المسؤولة عن النظام وقراراته وإمكان محاسبتها وفق أدوارها."},{id:"t2-C-m4",q:"أي من الخيارات التالية يُعد مثالاً واضحاً على التحيز في أنظمة الذكاء الاصطناعي؟",options:["نظام توظيف يفضل فئة بصورة غير عادلة أو نظام تعرف على الوجه تقل دقته مع فئات معينة","نظام حوسبة يعمل بدون إنترنت","محرك بحث يقدم نتائج سريعة","برنامج تشفير يعتمد على المفتاح العام"],correct:0,explain:"نظام توظيف متحيز أو تعرف وجه أقل دقة مع فئات معينة هو مثال واضح على التحيز الخوارزمي."}]}]},{id:3,title:"الدرس 3 - الذكاء الاصطناعي في الحياة اليومية والصناعة",badge:"الدرس الثالث",models:[{label:"A",essays:[{id:"t3-A-e1",q:"اشرح كيفية استخدام أنظمة التوصية في الحياة اليومية مع ذكر أمثلة تطبيقية مثل يوتيوب وأمازون؟",model:"تعتمد أنظمة التوصية على الذكاء الاصطناعي للتنبؤ بتفضيلات المستخدم بناءً على سجل سلوكه ومشترياته واهتماماته السابقة؛ حيث تعرض منصات مثل يوتيوب مقاطع فيديو مقترحة تناسب اهتماماته، بينما تعرض منصات مثل أمازون منتجات مشابهة لسجل تصفحه ومشترياته."},{id:"t3-A-e2",q:"اذكر استخدامات الذكاء الاصطناعي في الرعاية الصحية؟",model:"يُستخدم الذكاء الاصطناعي والتعلم العميق في تحليل الصور الطبية (مثل صور الأشعة السينية والتصوير المقطعي) للكشف المبكر عن الأمراض والأورام بدقة عالية، بالإضافة إلى الإسهام في اكتشاف الأدوية وتحليل البيانات الطبية المعقدة."},{id:"t3-A-e3",q:"اذكر أربعة قطاعات صناعية رئيسية يتم فيها إدخال تقنيات الذكاء الاصطناعي مع بيان دور كل قطاع باختصار؟",model:"1- الرعاية الصحية: الكشف عن الأمراض وتحليل الصور الطبية واكتشاف الأدوية. 2- الزراعة: التنبؤ بموعد الحصاد والكشف عن الآفات والأمراض ومراقبة المحاصيل. 3- التصنيع: أتمتة فحص جودة المنتج والصيانة التنبؤية للآلات قبل وقوع الأعطال. 4- الخدمات اللوجستية: تحسين مسارات التوصيل وإدارة حركة أسطول النقل."},{id:"t3-A-e4",q:"اشرح ما يبرع فيه الذكاء الاصطناعي وما يتطلب الحذر عند استخدامه فيما يتعلق بالقرارات ذات البعد الأخلاقي والخصوصية؟",model:"يبرع الذكاء الاصطناعي في إيجاد الأنماط وتصنيفها في البيانات المعقدة، والتعرف على الصور والصوت والنصوص وتوليدها، والاستدلال الاحتمالي والتنبؤ. بينما يتطلب الحذر الشديد عند اتخاذ الأحكام الأخلاقية، وحماية الخصوصية والمعلومات الشخصية، واتخاذ القرارات النهائية التي تتطلب إشرافاً ومسؤولية بشرية."}],mcqs:[{id:"t3-A-m1",q:"خدمة يومية تُستخدم لفهم الكلام وتنفيذ الأوامر الصوتية مثل Siri ومساعد جوجل هي:",options:["نظام التوصية","المساعد الصوتي","الترجمة الآلية","التعرف على الوجه"],correct:1,explain:"المساعد الصوتي هو من يفهم الكلام وينفذ الأوامر."},{id:"t3-A-m2",q:"قطاع صناعي يستخدم الذكاء الاصطناعي لتحسين مسارات التوصيل هو:",options:["الرعاية الصحية","الزراعة","التصنيع","الخدمات اللوجستية"],correct:3,explain:"تحسين مسارات التوصيل يخص الخدمات اللوجستية."},{id:"t3-A-m3",q:"ما هو المصطلح الذي يعبر عن عدم وضوح كيفية توصل الذكاء الاصطناعي إلى حكمه أو قراره؟",options:["الهلوسة","مشكلة الصندوق الأسود","التمييز أو التحيز","الاستدلال الاحتمالي"],correct:1,explain:"الصندوق الأسود هو غموض آلية اتخاذ القرار."},{id:"t3-A-m4",q:"من ضمن المهام التي يجيدها الذكاء الاصطناعي:",options:["التعرف على الصور والأصوات والنصوص وتوليد المحتوى","اتخاذ القرارات الأخلاقية المعقدة","ضمان دقة النتائج المطلقة دون بيانات تدريب","حماية الخصوصية الشخصية تلقائياً"],correct:0,explain:"التعرف على الصور والأصوات وتوليد المحتوى مما يبرع فيه AI."}]},{label:"B",essays:[{id:"t3-B-e1",q:"اذكر دور الذكاء الاصطناعي في المساعدات الصوتية مع ذكر مثالين.",model:"يعتمد دور الذكاء الاصطناعي في المساعدات الصوتية على التعرف على الصوت البشري، وفهم الأوامر الشفهية بلغة طبيعية، وتنسيق تنفيذها وتلبية طلبات المستخدم؛ ومن أمثلتها: تطبيق Siri ومساعد جوجل (Google Assistant)."},{id:"t3-B-e2",q:"ناقش دور الذكاء الاصطناعي في قطاعي الزراعة والخدمات اللوجستية في تحسين العمليات والإنتاجية؟",model:"في الزراعة يسهم في التنبؤ بمواعيد الحصاد والكشف المبكر عن الآفات والأمراض الزراعية. وفي الخدمات اللوجستية يسهم في تحسين وتحديد أفضل مسارات التوصيل وتقليل التكاليف وزمن النقل."},{id:"t3-B-e3",q:"وضح باختصار احتياطات الاستخدام المرتبطة ببيانات التدريب المتحيزة والقرارات عالية الأثر وتحديد المسؤولية؟",model:"يجب التأكد من عدم وجود تحيز في بيانات التدريب تجنباً لإنتاج مخرجات غير عادلة، كما يجب فرض الإشراف البشري الكامل على القرارات عالية الأثر وعدم ميكنتها كلياً، وتحديد أطر واضحة للمسؤولية والمساءلة بين المطور والمشغل والمستخدم."},{id:"t3-B-e4",q:"اشرح سبب ضرورة وجود تأكيد من طبيب بشري للتشخيص الطبي بدلاً من الاعتماد على الذكاء الاصطناعي وحده؟",model:"لأن مخرجات الذكاء الاصطناعي تقوم على التنبؤ الاحتمالي وقد تتعرض لأخطاء أو هلوسة نتيجة نقص أو تحيز بيانات التدريب، والتشخيص الطبي قرار عالي الأثر يتطلب تحمّل مسؤولية طبية وأخلاقية وحكماً بشرياً نهائياً."}],mcqs:[{id:"t3-B-m1",q:"نظام يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض التوصيات في منصات مثل يوتيوب وأمازون يسمى:",options:["نظام التوصية","المساعد الصوتي","الترجمة الآلية","التعرف على الوجه"],correct:0,explain:"نظام التوصية هو الذي يتنبأ بالتفضيلات."},{id:"t3-B-m2",q:"أي من الصناعات التالية تستخدم الذكاء الاصطناعي للتنبؤ بموعد الحصاد والكشف عن الآفات والأمراض؟",options:["الرعاية الصحية","الزراعة","التصنيع","الخدمات اللوجستية"],correct:1,explain:"الزراعة هي القطاع المعني بالحصاد والآفات."},{id:"t3-B-m3",q:"القرارات ذات البعد الأخلاقي التي قد تؤدي إلى تمييز أو تحيز تُعد ضمن:",options:["ما يبرع فيه الذكاء الاصطناعي","ما يتطلب الحذر عند استخدام الذكاء الاصطناعي","المهارات الأساسية للتعلم العميق","دور أنظمة التوصية اليومية"],correct:1,explain:"القرارات الأخلاقية تتطلب الحذر الشديد."},{id:"t3-B-m4",q:"يُعرف التحيز في أنظمة الذكاء الاصطناعي على أنه:",options:["نمط قد يؤدي إلى نتائج غير عادلة","الهلوسة","التراكب الكمي","الاستدلال الاحتمالي"],correct:0,explain:"التحيز هو نمط قد يؤدي لنتائج غير عادلة."}]},{label:"C",essays:[{id:"t3-C-e1",q:"اشرح ثلاث خدمات يمكن أن يؤديها الذكاء الاصطناعي في الحياة اليومية.",model:"1- أنظمة التوصية: عرض محتوى مخصص وتنبؤ بالتفضيلات الشخصية. 2- المساعدات الصوتية: فهم الأوامر الصوتية وتنفيذها عبر الهاتف. 3- الترجمة الآلية: تحويل النصوص فورياً من لغة أجنبية إلى اللغة الأم."},{id:"t3-C-e2",q:"اذكر مثالين لإسهام الذكاء الاصطناعي في قطاع التصنيع.",model:"أتمتة فحص جودة المخرجات والمنتجات، والصيانة التنبؤية للآلات والمعدات للتنبؤ بالأعطال قبل حدوثها."},{id:"t3-C-e3",q:"وضح الأبعاد المتعلقة بمشكلة الصندوق الأسود وقضايا الحقوق عند استخدام أعمال محمية بحقوق المؤلف كبيانات تدريب؟",model:"مشكلة الصندوق الأسود تعني فقدان الوضوح حول كيفية توصل النظام للقرار الخوارزمي، أما قضايا الحقوق فترتبط باستخدام محتوى مملوك للآخرين دون إذن في تدريب النماذج مما يثير نزاعات الملكية الفكرية."},{id:"t3-C-e4",q:"وضح الفروق الجوهرية بين ما يبرع فيه الذكاء الاصطناعي من إيجاد الأنماط وبين الجوانب التي تتطلب الحذر الشديد مثل الخصوصية والأخلاق؟",model:"يبرع الذكاء الاصطناعي في سرعة معالجة البيانات ضخمة الحجم وإيجاد العلاقة والأنماط والتنبؤ، ولكن يجب الحذر لأن الخوارزميات تفتقر إلى الفهم الأخلاقي والوعي الإنساني بالعدالة والخصوصية وتحمّل المسؤولية."}],mcqs:[{id:"t3-C-m1",q:"أي من الخيارات التالية يُعد مثالاً على نظام يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض التوصيات؟",options:["نظام التوصية","المساعد الصوتي","الترجمة الآلية","التعرف على الوجه"],correct:0,explain:"نظام التوصية هو التنبؤ بالتفضيلات."},{id:"t3-C-m2",q:"ما هي الخدمة التي تقوم بترجمة النص تلقائياً إلى لغات مختلفة كما ورد في خدمات الذكاء الاصطناعي اليومية؟",options:["نظام التوصية","المساعد الصوتي","الترجمة الآلية","التعرف على الوجه"],correct:2,explain:"الترجمة الآلية هي ترجمة النص تلقائياً."},{id:"t3-C-m3",q:"أي من الآتي يُعد الوصف الصحيح لما يبرع فيه الذكاء الاصطناعي؟",options:["إيجاد وتصنيف الأنماط في البيانات المعقدة والاستدلال الاحتمالي","اتخاذ الأحكام الأخلاقية المطلقة بدون بشر","ضمان خلو المخرجات تماماً من أي تحيز مستقبلي","حفظ البيانات الشخصية وحمايتها بسرية تامة"],correct:0,explain:"يبرع في إيجاد وتصنيف الأنماط والاستدلال الاحتمالي."},{id:"t3-C-m4",q:"عدم معرفة كيف توصل النظام لقراره يُعد تعريفاً لمشكلة:",options:["عدم معرفة كيف توصل النظام لقراره (الصندوق الأسود)","توليد معلومات غير صحيحة تبدو مقنعة","وجود تحيز في بيانات التدريب","انتهاك حقوق المؤلف"],correct:0,explain:"الصندوق الأسود هو عدم معرفة كيف توصل النظام لقراره."}]}]},{id:4,title:"الدرس 4 - القضايا الأخلاقية المتعلقة بالذكاء الاصطناعي",badge:"الدرس الرابع",models:[{label:"A",essays:[{id:"t4-A-e1",q:"اشرح ماهية «التحيز الخوارزمي» في أنظمة الذكاء الاصطناعي مبيناً كيف ينشأ من بيانات التدريب أو تصميم النظام وطريقة استخدامه مع ذكر أمثلة.",model:"التحيز الخوارزمي هو نمط في مخرجات النظام يؤدي إلى نتائج غير عادلة أو تمييزية ضارة. وينشأ بسبب وجود تحيز في بيانات التدريب أو عدم كفايتها لتمثيل كافة الفئات، أو بسبب الاختيار غير المناسب للمتغيرات عند تصميم النظام؛ ومثاله ترشيح الموظفين بنظام توظيف يفضل فئة عرقية أو جنسية معينة."},{id:"t4-A-e2",q:"تكلم بالتفصيل عن «الذكاء الاصطناعي القابل للتفسير (XAI)» ومشكلة «الصندوق الأسود» وكيف يساهم في تقييم النظام واكتشاف الأخطاء؟",model:"تقنية (XAI) هي أسلوب يتيح للبشر فهم وإظهار العوامل والمنطق الخوارزمي الذي أسهم في وصول النظام إلى نتيجة معينة. وتساعد على معالجة حالة غموض الصندوق الأسود عبر توضيح مسار القرار، مما يمكن المطورين والخبراء من تقييم الآلية وتتبع الثغرات والأخطاء الخوارزمية وتصحيحها."},{id:"t4-A-e3",q:"قارن بدقة بين مفهوم «المسؤولية» ومفهوم «المساءلة» موضحاً سبب اختلاف توزيع المسؤولية باختلاف السياقات والأطراف (المطور، المشغل، المستخدم)؟",model:"المسؤولية تتعلق بتحديد أدوار وواجبات كل طرف؛ فالمطور مسؤول عن جودة البيانات والتصميم، والمشغل عن طريقة النشر والتشغيل، والمستخدم عن طريقة الاستخدام الواعي. بينما المساءلة تعني تحديد الجهات التي يمكن محاسبتها عند حدوث ضرر أو خطأ؛ ويختلف التوزيع باختلاف من تسبب في العطل أو الضرر المباشر."},{id:"t4-A-e4",q:"اذكر المبادئ الأربعة الأساسية لأخلاقيات الذكاء الاصطناعي واشرح باختصار المقصود بكل من «العدالة»، «الشفافية»، «حماية الخصوصية»، و«المساءلة».",model:"1- العدالة: عدم التمييز ظلماً ضد أي شخص أو مجموعة. 2- الشفافية: إتاحة معلومات واضحة عن النظام وعملية اتخاذ القرار. 3- حماية الخصوصية: التعامل المناسب مع البيانات الشخصية وحفظها. 4- المساءلة: تحديد الجهات المسؤولة عن قرارات النظام وآثاره وإمكان محاسبتها."}],mcqs:[{id:"t4-A-m1",q:"نمط في مخرجات الذكاء الاصطناعي قد يؤدي إلى نتائج غير عادلة أو ضارة، وينشأ من البيانات أو التصميم يسمى:",options:["الذكاء الاصطناعي القابل للتفسير (XAI)","التحيز الخوارزمي","الشفافية المطلقة","حماية الخصوصية"],correct:1,explain:"التحيز الخوارزمي هو النمط المؤدي لنتائج غير عادلة."},{id:"t4-A-m2",q:"تقنية تتيح للبشر فهم سبب اتخاذ الذكاء الاصطناعي حكماً معيناً وتساعد على تجنب مشكلة الصندوق الأسود هي:",options:["الذكاء الاصطناعي القابل للتفسير (XAI)","الحوسبة الطرفية","بيانات التدريب","التحيز الخوارزمي"],correct:0,explain:"XAI يتيح فهم سبب اتخاذ الحكم."},{id:"t4-A-m3",q:"المبدأ الذي يعني التعامل مع المعلومات الشخصية بشكل مناسب وحمايتها هو:",options:["العدالة","الشفافية","حماية الخصوصية","المساءلة"],correct:2,explain:"حماية الخصوصية هي المبدأ المقصود."},{id:"t4-A-m4",q:"تحديد الجهات المسؤولة عن النظام وقراراته وآثاره وإمكان محاسبتها وفق أدوارها يمثل مبدأ:",options:["الشفافية","العدالة","المساءلة","حماية الخصوصية"],correct:2,explain:"المساءلة هي تحديد المسؤوليات والمحاسبة."}]},{label:"B",essays:[{id:"t4-B-e1",q:"وضح كيف يمكن أن تؤدي بيانات التدريب غير الممثلة أو المتحيزة (مثل انعكاس نزعات تمييزية سابقة) إلى تكرار الذكاء الاصطناعي لهذا التحيز في أحكامه.",model:"تتلقى الخوارزميات أنماط البيانات وتصيغ منها قواعدها الحسابية، فإذا احتوت بيانات التدريب التاريخية على أخطاء أو نزعات تمييزية سابقة أو نقص في تمثيل فئة معينة، فإن النظام يعتبر تلك التحيزات معياراً صحيحاً ويعيد إنتاجها وتكرارها بشكل آلي في المخرجات المستقبلية."},{id:"t4-B-e2",q:"اشرح مشكلة «الصندوق الأسود» في خوارزميات الذكاء الاصطناعي المعقدة ولماذا يجعل تقييم الآلية واكتشاف الأخطاء أمراً صعباً دون استخدام تقنيات التفسير.",model:"تنشأ المشكلة بسبب التعقيد العالي وتعدد الطبقات في الشبكات العصبية مما يجعل عملية الانتقال من المدخلات إلى القرار غير مرئية للعين البشرية؛ وهذا يخفي سبب أخطاء القرار ويصعّب تقييم النظام مالم تُطبق تقنيات التفسير (XAI) للكشف عن المنطق الخوارزمي الداخلي."},{id:"t4-B-e3",q:"اذكر قضايا الخصوصية المرتبطة بانتشار تقنيات التعرف على الوجه في الأماكن العامة والجمع الجماعي للبيانات والسلوك عبر الإنترنت.",model:"تؤدي إلى إمكانية تتبع حركة الأفراد بدون موافقتهم الصريحة، وتجميع السجلات الشخصية واستغلال البيانات في أغراض التنميط أو الانتهاك الدائم لخصوصية حياتهم الرقمية والواقعية."},{id:"t4-B-e4",q:"اشرح بالتفصيل المبادئ الأربعة الأساسية لأخلاقيات الذكاء الاصطناعي وكيف يوجه كل منها الاستخدام المسؤول لهذه التقنيات في المجتمع.",model:"يوجه العدالة النظام لعدم التمييز بين الأفراد، ويمنح مبدأ الشفافية المستخدم حق فهم الحدود وكيفية اتخاذ القرار، ويحمي مبدأ حماية الخصوصية البيانات الشخصية، بينما يُحدد مبدأ المساءلة الجهات والمؤسسات المسؤولة التي يمكن محاسبتها عن أي خلل."}],mcqs:[{id:"t4-B-m1",q:"الأمثلة التي يتعلم منها نظام الذكاء الاصطناعي أنماطه قبل استخدامه وتؤثر بشكل مباشر على جودة مخرجاته تسمى:",options:["بيانات التدريب","خوارزميات التشفير","الأجهزة الطرفية","الذاكرة العشوائية"],correct:0,explain:"بيانات التدريب هي التي يتعلم منها النظام."},{id:"t4-B-m2",q:"إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وعملية اتخاذ القرار وحدوده يعد تعريفاً دقيقاً لمبدأ:",options:["العدالة","الشفافية","المساءلة","حماية الخصوصية"],correct:1,explain:"الشفافية هي إتاحة معلومات واضحة عن النظام."},{id:"t4-B-m3",q:"عدم التمييز ظلماً ضد أي شخص أو مجموعة بعينها في أحكام ومخرجات الذكاء الاصطناعي يمثل مبدأ:",options:["العدالة","الشفافية","حماية الخصوصية","المساءلة"],correct:0,explain:"العدالة هي عدم التمييز ظلماً."},{id:"t4-B-m4",q:"الأسلوب أو التقنية التي تساعد البشر على فهم العوامل التي أسهمت في وصول النظام إلى مخرج أو قرار معين هي:",options:["التحيز الخوارزمي","الذكاء الاصطناعي القابل للتفسير (XAI)"],correct:1,explain:"XAI يساعد على فهم العوامل المؤثرة في المخرجات."}]},{label:"C",essays:[{id:"t4-C-e1",q:"ناقش أسباب التحيز الخوارزمي وكيف يمكن أن ينشأ من الاختيار غير المناسب للمتغيرات، أو استخدام متغير بديل يمثل بشكل غير مباشر سمة محمية؟",model:"ينشأ التحيز عند اختيار متغيرات غير متوازنة، أو عند حذف سمة حساسة (مثل الجنس أو النژاد) مع استبدالها بمتغير بديل (مثل الرمز البريدي أو المسمى الوظيفي) يرتبط بها وثيقاً، فيستمر النظام في إجراء التمييز الضمني غير المباشر بسببه."},{id:"t4-C-e2",q:"بين أهمية «الذكاء الاصطناعي القابل للتفسير (XAI)» في معالجة صعوبة تقييم آلية الوصول إلى النتيجة عندما تكون غير واضحة للعين البشرية؟",model:"تكمن أهميته في تقديم أدوات تفكك التعقيد الداخلي للنماذج العميقة وتوضح الوزن النسبي للمتغيرات، مما يحول النظام من صندوق أسود غامض إلى نموذج شفاف يمكن التحقق من صحة منطق أحكامه واكتشاف أسباب الخلل."},{id:"t4-C-e3",q:"وضح الأبعاد المختلفة لمسؤولية الأطراف المتعددة (المطور، الشركة المشغلة، المستخدم) عند اتخاذ نظام الذكاء الاصطناعي حكماً خاطئاً أو غير عادل.",model:"يتحمل المطور مسؤولية جودة بناء النموذج واختبار التحيز والبيانات، بينما تتحمل الشركة المشغلة مسؤولية قرار النشر والسياق المطبق فيه النظام، ويتحمل المستخدم مسؤولية متابعة المخرجات وإعمال التفكير الناقد وعدم الاعتماد الأعمى عليها."},{id:"t4-C-e4",q:"اشرح كيف تتكامل المبادئ الأربعة لأخلاقيات الذكاء الاصطناعي (العدالة، الشفافية، حماية الخصوصية، المساءلة) لتشكيل إطار متكامل للاستخدام المسؤول.",model:"تتكامل المبادئ بحيث تضمن العدالة مخرجات متكافئة، وتتيح الشفافية وفهم آلية القرار تحقق أفراد المجتمع منه، بينما تحمي الخصوصية البيانات الحساسة، ويضمن مبدأ المساءلة وجود أطراف محددة يُرجع إليها لمحاسبتها وتعديل الأخطاء عند وقوعها."}],mcqs:[{id:"t4-C-m1",q:"تحديد أدوار وواجبات الأطراف المرتبطة بتطوير النظام وتشغيله واستخدامه (المطور، المشغل، المستخدم) يشير إلى مصطلح:",options:["المسؤولية","التحيز الخوارزمي","بيانات التدريب","الشفافية"],correct:0,explain:"المسؤولية هي تحديد أدوار وواجبات الأطراف."},{id:"t4-C-m2",q:"نظام أو تقنية تجمع كميات كبيرة من بيانات السلوك عبر الإنترنت وتسمح بتتبع الأفراد في الأماكن العامة تثير قضايا تتعلق بـ:",options:["سرعة المعالجة الحاسوبية","حماية الخصوصية","كفاءة الذاكرة المركزية","قانون مور"],correct:1,explain:"تثير قضايا حماية الخصوصية."},{id:"t4-C-m3",q:"إحدى الآتي تمثل الوصف الدقيق لمبدأ «المساءلة»:",options:["إتاحة معلومات واضحة عن النظام وحدوده","عدم التمييز ظلماً ضد أي شخص أو مجموعة","تحديد الجهات المسؤولة عن النظام وقراراته وإمكان محاسبتها وفق أدوارها","فهم العوامل التي أسهمت في وصول النظام إلى مخرج معين"],correct:2,explain:"المساءلة هي تحديد الجهات المسؤولة ومحاسبتها."},{id:"t4-C-m4",q:"أي من الخيارات التالية يُعد مثالاً واضحاً على التحيز في أنظمة الذكاء الاصطناعي؟",options:["نظام توظيف يفضل فئة بصورة غير عادلة أو نظام تعرف على الوجه تقل دقته مع فئات معينة","نظام حوسبة يعمل بدون إنترنت","محرك بحث يقدم نتائج سريعة","برنامج تشفير يعتمد على المفتاح العام"],correct:0,explain:"نظام التوظيف المتحيز ونظام التعرف الأقل دقة مع فئات معينة هما مثال على التحيز."}]}]}],eu=[{id:"1-1",title:"تطور تكنولوجيا المعلومات والتحول الاجتماعي",badge:"الدرس 1-1",icon:Pr,concepts:[{name:"الحواسيب الشخصية PCs",def:"انتشرت في السبعينيات والثمانينيات، فبدأ استخدامها على نطاق أوسع بين الأفراد بعدما كانت مقتصرة على الأغراض العسكرية والعلمية."},{name:"الإنترنت",def:"أُتيح للاستخدام التجاري في التسعينيات وانتشر الويب، فانتشر الوصول العالمي إلى المعلومات."},{name:"الهواتف الذكية",def:"ظهرت في العقد الأول من الألفية، فانتشر الإنترنت عبر الهواتف المحمولة بسرعة هائلة."},{name:"الحوسبة السحابية",def:"التقنية التي انتشرت من العقد الثاني من الألفية فصاعداً، وتدعم تحليل البيانات الضخمة واستخدام الذكاء الاصطناعي."},{name:"قانون مور",def:"الملاحظة التجريبية القائلة إن عدد الترانزستورات في الدائرة المتكاملة يتضاعف تقريباً كل عامين، مع تحديات تيارات التسرب والتأثيرات الكمومية."},{name:"التجارة الإلكترونية",def:"بيع السلع والخدمات وشراؤها عبر الإنترنت."},{name:"العمل عن بُعد",def:"أداء الشخص عمله من المنزل أو من موقع بعيد عبر الإنترنت."},{name:"الدفع غير النقدي",def:"نظام دفع قيمة السلع بوسائل غير نقدية مثل البطاقات أو تطبيقات الهاتف أو رموز QR دون استخدام النقد."},{name:"القيادة الذاتية",def:"تقنية تستخدم الذكاء الاصطناعي لقيادة مركبة بأقل تدخل بشري بحسب مستوى الأتمتة."},{name:"SNS",def:"شبكات التواصل الاجتماعي - أحد التحولات الخمسة الرئيسية الناتجة عن تكنولوجيا المعلومات."},{name:"الواقع المعزز AR",def:"التقنية التي تضيف عناصر أو معلومات رقمية فوق مشهد من العالم الحقيقي."}],objectives:["تتبع تطور تكنولوجيا المعلومات من الأربعينيات (عسكرية/علمية) حتى انتشار الحواسيب الشخصية والإنترنت والهواتف الذكية والحوسبة السحابية.","فهم قانون مور وتحدياته الهندسية والفيزيائية وتأثيره على تصغير الدوائر المتكاملة.","استيعاب التحولات الخمسة: SNS، التجارة الإلكترونية، العمل عن بُعد، التعلم عبر الإنترنت، الدفع غير النقدي، مع مفاهيم AR و VR."],fill:{q:"ظهرت الحواسيب الإلكترونية في أربعينيات القرن العشرين واسُتخدمت أولاً في أغراض عسكرية وحسابات علمية. املأ الفراغات:",blanks:["انتشرت ( 1 ) ______ في السبعينيات والثمانينيات، فبدأ استخدامها على نطاق أوسع بين الأفراد.","في التسعينيات أُتيح ( 2 ) ______ للاستخدام التجاري وانتشر الويب، فانتشر الوصول العالمي إلى المعلومات.","في العقد الأول من الألفية ظهرت ( 3 ) ______، فانتشر الإنترنت عبر الهواتف المحمولة بسرعة."],answers:["الحواسيب الشخصية (PCs)","الإنترنت","الهواتف الذكية"]},simples:[{q:"ما التقنية التي انتشرت من العقد الثاني من الألفية فصاعداً، والتي تدعم تحليل البيانات الضخمة واستخدام الذكاء الاصطناعي؟",a:"الحوسبة السحابية (Cloud Computing)"},{q:'ما اسم الملاحظة التجريبية القائلة إن "عدد الترانزستورات في الدائرة المتكاملة يتضاعف تقريباً كل عامين"؟',a:"قانون مور (Moore's Law)"}],terms:{q:"حدد المصطلحات:",items:[{q:"ما المصطلح الذي يشير إلى بيع السلع والخدمات وشرائها عبر الإنترنت؟",a:"التجارة الإلكترونية"},{q:"ما المصطلح الذي يصف أداء الشخص عمله من المنزل أو من موقع بعيد عبر الإنترنت؟",a:"العمل عن بُعد"},{q:"ما المصطلح الذي يشير إلى نظام إجراء المدفوعات بالنقود الإلكترونية ورموز QR وغيرها، دون استخدام النقد؟",a:"الدفع غير النقدي"},{q:"ما المصطلح الذي يشير إلى التقنية التي تستخدم الذكاء الاصطناعي لقيادة مركبة بأقل تدخل بشري بحسب مستوى الأتمتة؟",a:"القيادة الذاتية"}]},essays:[{id:"1-1-e1",q:"اشرح تطور تكنولوجيا المعلومات في الفترة الممتدة من الأربعينيات إلى الستينيات موضحاً استخدامها الأساسي في تلك الفترة.",model:"ظهرت الحواسيب الإلكترونية في أربعينيات القرن العشرين، وكان استخدامها الأساسي مقتصراً على الأغراض العسكرية والحسابات العلمية لدى المؤسسات والجهات الحكومية."},{id:"1-1-e2",q:"اشرح «قانون مور» موضحاً ما يصفه، والتحديات الهندسية والفيزيائية التي تواجه استمرار تصغير مكونات الدوائر.",model:'يصف قانون مور الاتجاه التاريخي الذي ينص على أن "عدد الترانزستورات في الدائرة المتكاملة يتضاعف تقريباً كل عامين". وتواجه استمرار هذا التصغير تحديات هندسية وفيزيائية مثل تيارات التسرب والتأثيرات الكمومية التي تُبطئ هذا الاتجاه.'},{id:"1-1-e3",q:"عدّد التحولات المجتمعية الخمسة الناتجة عن تكنولوجيا المعلومات، موضحاً مفهوم كل من «العمل عن بعد» و«التجارة الإلكترونية».",model:"التحولات الخمسة: شبكات التواصل الاجتماعي (SNS)، التجارة الإلكترونية، العمل عن بُعد، التعلم عبر الإنترنت، والدفع غير النقدي. العمل عن بعد: أداء الشخص لعمله من المنزل أو من موقع بعيد آخر عبر الإنترنت. التجارة الإلكترونية: بيع السلع والخدمات وشراؤها عبر الإنترنت."}],mcqs:[{id:"1-1-m1",q:"ما هي الملاحظة التجريبية التي تصف اتجاهاً تاريخياً لازدياد عدد الترانزستورات في الدوائر المتكاملة بمعدل يقارب الضعف كل عامين؟",options:["الحوسبة السحابية","قانون مور","الحوسبة الطرفية","التراكب الكمي"],correct:1,explain:"قانون مور هو التفسير الدقيق المذكور في الكتاب."},{id:"1-1-m2",q:"ما المقصود بمصطلح «الدفع غير النقدي (Cashless Payment)»؟",options:["دفع نقدي يدوي فقط","دفع قيمة السلع أو الخدمات بوسائل غير نقدية مثل البطاقات أو تطبيقات الهاتف أو رموز QR","تحويل الأموال عبر البريد فقط","مقايضة السلع"],correct:1,explain:"التعريف النموذجي المباشر من متن المصدر."},{id:"1-1-m3",q:"التقنية التي تضيف عناصر أو معلومات رقمية فوق مشهد من العالم الحقيقي تُعرف باسم:",options:["الواقع الافتراضي (VR)","القيادة الذاتية","الواقع المعزز (AR)","الحوسبة الكمومية"],correct:2,explain:"AR هو إضافة عناصر رقمية فوق الواقع الحقيقي."},{id:"1-1-m4",q:"في أي فترة زمنية أُتيح الإنترنت للاستخدام التجاري وظهر الويب مما توسع معه الوصول العالمي إلى المعلومات؟",options:["الأربعينيات والستينيات","التسعينيات","السبعينيات والثمانينيات","من العقد الثاني من الألفية"],correct:1,explain:"التسعينيات هي فترة الإتاحة التجارية للإنترنت."}]},{id:"1-2",title:"كيف يعمل الذكاء الاصطناعي",badge:"الدرس 1-2",icon:_r,concepts:[{name:"AI",def:"المصطلح العام للأنظمة الحاسوبية القادرة على أداء مهام مثل التعلم والتعرف والتنبؤ وتوليد المحتوى واتخاذ القرارات."},{name:"ML التعلم الآلي",def:"فرع من الذكاء الاصطناعي تتعلم فيه النماذج أنماطاً من البيانات بدلاً من البرمجة الصريحة للقواعد."},{name:"DL التعلم العميق",def:"أسلوب من أساليب التعلم الآلي يعتمد على شبكات عصبية اصطناعية متعددة الطبقات لتعلم تمثيلات وأنماط معقدة."},{name:"GenAI التوليدي",def:"أنظمة الذكاء الاصطناعي التي تنشئ محتوى جديداً ومبتكراً كالنصوص والصور والأصوات والبرمجيات."},{name:"طبقة الإدخال",def:"أولى مكونات الشبكة العصبية الاصطناعية، تستقبل البيانات الخام."},{name:"الطبقات المخفية",def:"طبقات وسيطة بين الإدخال والإخراج، يتم فيها تغيير الأوزان أثناء التدريب لتعلم الأنماط."},{name:"طبقة الإخراج",def:"الطبقة النهائية التي تُنتج نتيجة التنبؤ أو التصنيف أو التوليد."},{name:"الهلوسة",def:"ظاهرة إنتاج الذكاء الاصطناعي التوليدي لنص يبدو معقولاً ولكنه غير صحيح واقعياً ومضلل."},{name:"Narrow AI",def:"معظم أنظمة الذكاء الحالية مصممة لأداء مهمة محددة أو مجموعة محدودة من المهام - ضيق النطاق."},{name:"مرشحات الرسائل المزعجة",def:"مثال مباشر على تطبيقات التعلم الآلي: تصفية السبام وتوصيات المنتجات."}],objectives:["تمييز مستويات الذكاء: AI كمظلة عامة، ML كتعلم أنماط من البيانات، DL كشبكات عميقة متعددة الطبقات، GenAI كتوليد محتوى جديد.","فهم مكونات الشبكة العصبية وآلية تغير الأوزان بين العصبونات أثناء التدريب.","إدراك مخاطر الهلوسة وحدود الذكاء الاصطناعي في الأحكام الأخلاقية والخصوصية والمسؤولية."],studentQs:[{q:"ما المصطلح العام للأنظمة الحاسوبية القادرة على أداء مهام مثل التعلم والتعرف والتنبؤ وتوليد المحتوى؟",a:"الذكاء الاصطناعي (AI)"},{q:"ما المصطلح الذي يصف فرع الذكاء الاصطناعي الذي تتعلم فيه النماذج أنماطاً من البيانات؟",a:"التعلم الآلي (Machine Learning - ML)"},{q:"ما المصطلح الذي يصف أسلوب التعلم الآلي المعتمد على شبكات عصبية متعددة الطبقات؟",a:"التعلم العميق (Deep Learning - DL)"},{q:"ما المصطلح الذي يصف أنظمة الذكاء الاصطناعي التي تنشئ محتوى جديداً؟",a:"الذكاء الاصطناعي التوليدي (Generative AI – GenAI)"},{q:'يمكن للذكاء الاصطناعي التوليدي إنتاج نص يبدو معقولاً ولكنه غير صحيح واقعياً ("هلوسة"). اشرح لماذا من الخطر استخدام هذا الناتج كإجابة لتقرير مدرسي كما هو، واذكر ما الذي يجب فعله للتحقق.',a:"الخطر يكمن في إمكانية تضليل الطالب ونقل معلومات غير صحيحة واقعياً في التقرير المدرسي. والواجب فعله هو التحقق من مخرجات الذكاء الاصطناعي ومقارنتها بالحقائق والمصادر الموثوقة قبل الاعتماد عليها."},{q:"حلّل لماذا يناسب الذكاء الاصطناعي بعض المهام بينما يتطلب الحذر في مهام أخرى؟",a:"يبرع الذكاء الاصطناعي في المهام التي تعتمد على إيجاد الأنماط، والتعرف على الصور والصوت والنصوص، والتنبؤ والاستدلال الاحتمالي بناءً على البيانات. بينما يتطلب الحذر الشديد في المهام التي تشمل الأحكام الأخلاقية، وحماية الخصوصية، واتخاذ القرارات النهائية التي تتطلب تحمل المسؤولية."}],essays:[{id:"1-2-e1",q:"عرّف مفهوم الذكاء الاصطناعي، موضحاً في ثلاث نقاط الفرق بين التعلم الآلي والتعلم العميق والذكاء الاصطناعي التوليدي.",model:"الذكاء الاصطناعي (AI): مجال يضم أنظمة حاسوبية تستطيع تنفيذ مهام مثل التعلم من البيانات والتنبؤ والتعرف وتوليد المحتوى واتخاذ القرارات أو دعمها. الفروق: 1) التعلم الآلي (ML): فرع تتعلم فيه النماذج أنماطاً من البيانات بدلاً من البرمجة الصريحة. 2) التعلم العميق (DL): أسلوب من ML يعتمد على شبكات عصبية متعددة الطبقات لتعلم تمثيلات معقدة. 3) GenAI: أحد تطبيقات DL التي تنشئ وتولد محتوى جديداً كالنصوص والصور والأصوات."},{id:"1-2-e2",q:"ما المكونات الأساسية للشبكة العصبية الاصطناعية؟",model:"تتكون من طبقة الإدخال (Input Layer)، الطبقات المخفية (Hidden Layers)، وطبقة الإخراج (Output Layer) مع وجود ترابط بين العصبونات وتغير أوزانها أثناء التدريب."},{id:"1-2-e3",q:"ناقش مشكلة «الهلوسة» في الذكاء الاصطناعي التوليدي، موضحاً سبب خطورتها والإجراء المناسب للتحقق من المخرجات.",model:"الهلوسة: إنتاج الذكاء الاصطناعي التوليدي لنصوص تبدو معقولة ومقنعة ظاهرياً ولكنها غير صحيحة واقعياً. سبب خطورتها: تؤدي إلى الاعتماد على معلومات خاطئة ومضللة في التقارير والواجبات المدرسية. الإجراء المناسب: التحقق الدائم من المخرجات ومقارنتها بالحقائق والمصادر العلمية الموثوقة وعدم الاعتماد المطلق عليها."}],mcqs:[{id:"1-2-m1",q:"ما هو المصطلح الذي يصف أسلوباً من أساليب التعلم الآلي يعتمد على شبكات عصبية متعددة الطبقات لتعلم تمثيلات وأنماط معقدة؟",options:["التعلم الآلي","الذكاء الاصطناعي التوليدي","التعلم العميق","البرمجة التقليدية"],correct:2,explain:"التعلم العميق هو المعتمد على شبكات متعددة الطبقات."},{id:"1-2-m2",q:"ما هي الوظيفة الأساسية لأنظمة «الذكاء الاصطناعي التوليدي»؟",options:["حفظ البيانات فقط","إنشاء محتوى جديد مثل النصوص والصور والصوت والبرمجيات","تشغيل الحاسوب بدون كهرباء","حذف البيانات"],correct:1,explain:"GenAI ينشئ محتوى جديداً مبتكراً."},{id:"1-2-m3",q:"عندما يُنتج الذكاء الاصطناعي التوليدي نصاً يبدو معقولاً ولكن غير صحيح واقعياً، تُسمى هذه الظاهرة بـ:",options:["الهلوسة","التراكب الكمي","الحوسبة الطرفية","التشغيل الخطى"],correct:0,explain:"ظاهرة الهلوسة هي إنتاج نص معقول ظاهرياً غير صحيح واقعياً."},{id:"1-2-m4",q:"معظم أنظمة الذكاء الاصطناعي الحالية تُصمم لأداء مهمة محددة أو مجموعة محدودة من المهام، وتُعرف بـ:",options:["مهمة محددة أو مجموعة محدودة من المهام (ضيق النطاق - Narrow AI)","ذكاء عام خارق","ذكاء بلا حدود","وعي ذاتي"],correct:0,explain:"Narrow AI هو المصطلح الدقيق."},{id:"1-2-m5",q:"أي من الخيارات التالية يُعد مثالاً مباشراً على تطبيقات «التعلم الآلي»؟",options:["مرشحات الرسائل المزعجة وتوصيات المنتجات","آلة كاتبة يدوية","مصباح كهربائي","قلم رصاص"],correct:0,explain:"مرشحات السبام وتوصيات المنتجات هي ML تطبيقي."}]},{id:"1-3",title:"الذكاء الاصطناعي في الحياة اليومية والصناعة",badge:"الدرس 1-3",icon:nt,concepts:[{name:"نظام التوصية",def:"نظام يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض مقاطع/منتجات ملائمة مثل توصيات الفيديو."},{name:"المساعد الصوتي",def:"نظام يتعرف على الصوت ويفهم الأوامر وينفذها مثل Siri ومساعد جوجل."},{name:"الترجمة الآلية",def:"تقنية تحول نصاً بلغة أجنبية إلى اللغة الأم فورياً."},{name:"التعرف على الوجه",def:"تقنية ذكاء اصطناعي للتعرف على الهوية من ملامح الوجه."},{name:"التشخيص بالصور",def:"استخدام الذكاء الاصطناعي والتعلم العميق في تحليل الصور الطبية مثل الأشعة والتصوير المقطعي للكشف المبكر عن الأمراض."},{name:"الصيانة التنبؤية",def:"استخدام البيانات للتنبؤ بأعطال الآلات أو المعدات قبل وقوعها في التصنيع."},{name:"الخدمات اللوجستية",def:"قطاع يتم فيه تحسين مسارات التوصيل وإدارة حركة أسطول النقل بالذكاء الاصطناعي."},{name:"الزراعة الذكية",def:"التنبؤ بموعد الحصاد والكشف عن الآفات والأمراض ومراقبة المحاصيل."},{name:"الصندوق الأسود",def:"عدم الوضوح وغموض كيفية توصل الذكاء الاصطناعي إلى حكمه أو قراره."},{name:"الهلوسة",def:"إنتاج نص مقنع غير صحيح واقعياً ويحتاج تحقق دائم."}],objectives:["ربط تطبيقات يومية: توصية الفيديو من سلوك سابق، مساعد صوتي يفهم الأوامر، ترجمة آلية فورية.","تحليل قطاعات صناعية: رعاية صحية (تشخيص صور)، تصنيع (فحص جودة + صيانة تنبؤية)، زراعة (حصاد/آفات)، لوجستيات (مسارات).","تمييز ما يبرع فيه AI (سرعة معالجة كميات ضخمة، تصنيف أنماط، تعرف صور/صوت/نص) وما يتطلب حذر (أخلاق، خصوصية، قرار نهائي بإشراف بشري)."],fill:{q:"يُستخدم الذكاء الاصطناعي على نطاق واسع في حياتنا اليومية. املأ الفراغات:",blanks:["توصيات مقاطع الفيديو التي تناسب تفضيلات المرء على موقع فيديو تأتي من نظام ( 1 ) ______.","تُستخدم تقنية الذكاء الاصطناعي في ( 2 ) ______، والتي يمكن للمرء من خلالها التحدث إلى هاتف ذكي لتشغيله.","تُستخدم تقنية الذكاء الاصطناعي في ( 3 ) ______، التي تحول نصاً بلغة أجنبية إلى اللغة الأم."],answers:["التوصية (Recommendation System)","المساعد الصوتي (Voice Assistant)","الترجمة الآلية (Machine Translation)"]},simples:[{q:"في أي صناعة تُستخدم أنظمة الذكاء الاصطناعي للتشخيص بالصور؟",a:"الرعاية الصحية (Healthcare)"},{q:"في التصنيع، ما المصطلح الذي يصف استخدام البيانات للتنبؤ بأعطال الآلات أو المعدات قبل وقوعها؟",a:"الصيانة التنبؤية (Predictive Maintenance)"},{q:"حلّل ما يبرع فيه الذكاء الاصطناعي وما يتطلب الحذر عند استخدامه في الحياة اليومية والصناعة؟",a:"ما يبرع فيه: المعالجة عالية السرعة لكميات كبيرة من البيانات، وإيجاد الأنماط وتصنيفها، والتعرف على الصور والصوت والنصوص، والاستدلال الاحتمالي. ما يتطلب الحذر: الأحكام الأخلاقية، والأحكام التي تشمل المعلومات الشخصية والخصوصية، واتخاذ القرار النهائي الذي يتطلب إشرافاً ومراجعة بشرية."}],essays:[{id:"1-3-e1",q:"اشرح كيف أصبحت تقنيات مثل منصات الفيديو والمساعدات الصوتية جزءاً من الخدمات اليومية، وما هو الدور الأساسي للذكاء الاصطناعي فيها؟",model:"تعتمد منصات الفيديو على أنظمة التوصية التي تتنبأ بالتفضيلات من بيانات السلوك السابق وتفرض مقاطع ملائمة، بينما تعتمد المساعدات الصوتية على التعرف على الصوت وفهم الأوامر الشفهية وتنسيق تنفيذها، وتعمل الترجمة الآلية على تحويل النصوص فورياً بين اللغات."},{id:"1-3-e2",q:"وضح المقصود بـ «الذكاء الاصطناعي للتشخيص بالصور» في مجال الرعاية الصحية، وكيف يسهم في الكشف عن الأمراض؟",model:"هو استخدام الذكاء الاصطناعي والتعلم العميق في معالجة البيانات المعقدة وتحليل الصور الطبية مثل صور الأشعة السينية والتصوير المقطعي للكشف المبكر عن الأمراض والورم بدقة تماثل أو تدعم الفحص الطبي البشري."},{id:"1-3-e3",q:"اذكر أربعة قطاعات صناعية رئيسية يتم فيها إدخال تقنيات الذكاء الاصطناعي مع بيان دور كل قطاع باختصار؟",model:"1) الرعاية الصحية: تحليل الصور الطبية واكتشاف الأدوية. 2) الزراعة: التنبؤ بموعد الحصاد والكشف عن الآفات والأمراض ومراقبة المحاصيل. 3) التصنيع: فحص جودة المنتج والصيانة التنبؤية للآلات قبل عطلها. 4) الخدمات اللوجستية: تحسين مسارات التوصيل وإدارة حركة أسطول النقل."},{id:"1-3-e4",q:"ما الأبعاد المتعلقة بمشكلة «الصندوق الأسود» في تطبيقات الذكاء الاصطناعي؟",model:"تعبر مشكلة الصندوق الأسود عن عدم الوضوح وغموض كيفية توصل الذكاء الاصطناعي إلى حكمه أو قراره، مما يصعب على البشر فهم منطق القرار أو تقييم الآلية التي أدت إلى المخرج."}],mcqs:[{id:"1-3-m1",q:"ما هو النظام الذي يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض التوصيات؟",options:["نظام التوصية","المساعد الصوتي","الترجمة الآلية","التعرف على الوجه"],correct:0,explain:"نظام التوصية هو الذي يتنبأ بالتفضيلات."},{id:"1-3-m2",q:"ما المصطلح الذي يشير إلى نظام الذكاء الاصطناعي الذي يتعرف على الصوت، وفهم الأوامر، وتنفيذها مثل Siri ومساعد جوجل؟",options:["نظام التوصية","المساعد الصوتي","الترجمة الآلية","التعرف على الوجه"],correct:1,explain:"المساعد الصوتي هو التعريف المطابق."},{id:"1-3-m3",q:"أي من القطاعات الصناعية التالية ترتبط بمهمة «تحسين مسارات التوصيل»؟",options:["الرعاية الصحية","الزراعة","التصنيع","الخدمات اللوجستية"],correct:3,explain:"تحسين المسارات يخص الخدمات اللوجستية."},{id:"1-3-m4",q:"ما هي التقنية المستخدمة في فحص جودة المنتج والتنبؤ بأعطال الآلات قبل وقوعها؟",options:["التشخيص بالصور","الذكاء الاصطناعي في التصنيع والصيانة التنبؤية","نظم التوصية","الترجمة الآلية"],correct:1,explain:"الصيانة التنبؤية في التصنيع هي الإجابة الدقيقة."}]},{id:"1-4",title:"القضايا الأخلاقية المتعلقة بالذكاء الاصطناعي",badge:"الدرس 1-4",icon:Nr,concepts:[{name:"التحيز الخوارزمي",def:"نمط في مخرجات الذكاء الاصطناعي قد يؤدي إلى نتائج غير عادلة أو ضارة، وينشأ من تحيز بيانات التدريب أو عدم تمثيلها أو اختيار متغيرات غير مناسب."},{name:"بيانات التدريب",def:"البيانات المستخدمة لتعليم النموذج؛ تحيزها أو عدم كفايتها سبب رئيسي للتحيز الخوارزمي."},{name:"XAI",def:"الذكاء الاصطناعي القابل للتفسير - أساليب تساعد على فهم العوامل المؤثرة في المخرجات لمعالجة الصندوق الأسود."},{name:"الصندوق الأسود",def:"غموض آلية اتخاذ القرار في النموذج وصعوبة فهم منطقه."},{name:"المسؤولية",def:"تحديد أدوار وواجبات كل طرف مرتبطة بتطوير النظام وتشغيله واستخدامه."},{name:"المساءلة Accountability",def:"تحديد الجهات المسؤولة عن النظام وقراراته وآثاره وإمكانية محاسبتها وفق أدوارها عند حدوث خطأ أو ضرر."},{name:"العدالة Fairness",def:"عدم التمييز ظلماً ضد أي شخص أو مجموعة، م
